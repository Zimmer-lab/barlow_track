# Template for hyperparameter search configuration file
#
# NOTE: crop size (target_sz_z / target_sz_xy) is intentionally NOT searched:
# it changes the data pipeline and breaks checkpoint comparability. Search
# focuses on the attention/fusion anti-collapse parameters instead. All names
# below must be top-level train_config.yaml keys (the runner merges them flat
# over the baseline; nested dicts like position_augment cannot be swept).

baseline_params_path: null

hyperparameters:
  - name: lr
    type: range
    bounds: [0.000001, 0.001]
    log_scale: true

  - name: embedding_dim
    type: choice
    values: [256, 512]
    value_type: int
    is_ordered: true

  # Intra-volume self-attention depth; 0 disables attention (fusion-only ablation)
  - name: self_layers
    type: choice
    values: [0, 1, 2]
    value_type: int
    is_ordered: true

  # Initial attention gate logit: sigmoid(-6)~0.002 (nearly off) to
  # sigmoid(0)=0.5 (half-on). Default -4.0 starts "almost off".
  - name: attn_gate_init
    type: range
    bounds: [-6.0, 0.0]

  - name: fusion
    type: choice
    values: [concat, add]

  - name: fusion_norm
    type: choice
    values: [layernorm, l2]

  # Weight on the object-space (transposed) Barlow loss; 0 = feature loss only
  # - name: lambd_obj
  #   type: range
  #   bounds: [0.0, 1.0]

  # Separate off-diagonal weight for the object-space loss (falls back to
  # lambd when null); suggested sweep 0.05-0.3 post-LayerNorm.
  # - name: lambd_obj_offdiag
  #   type: range
  #   bounds: [0.05, 0.3]
  #   log_scale: true

  # Pre-attention volume-mean centering (C2); false = legacy behavior.
  # - name: center_per_volume
  #   type: choice
  #   values: [true, false]
