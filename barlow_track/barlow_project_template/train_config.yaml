# Parameters for training a BarlowTrack model

# CHANGEME: these parameters are specific for each model and dataset
project_path:

# Optional (but recommended) path to a pretrained model; note that the architecture parameters must be the same for this to work
# If you want to train from scratch, set this to null
pretrained_model_path:  # Directly pass the .pth file of the pretrained model (the model weights)

# Optional (but recommended): if you have a wandb account, you can set the project name and run name here
wandb_name: null      # Project name
wandb_username: null  # Account name

####
# Hyperparameters for training the model
####

# Architecture
projector: '1024-1024'  # Halved from the paper's 2048: full size memorizes small (<200 vol) training sets
projector_final: 512
projector_norm: batchnorm  # hidden-layer norm: 'batchnorm' (paper regime, default) | 'layernorm' | 'none'
embedding_dim: 64  # Projector also gets an additional first layer of size 'embedding_dim'

backbone_kwargs:
  num_levels: 2
  f_maps: 4  # Default in paper is 64... is this super small?

# Size of image crop (around each neuron) to use
target_sz_z: 8
target_sz_xy: 64

# Optimization hyperparameters
lambd: 0.0051
batch_size: 1  # This should stay; one volume = one batch
weight_decay: 1.0e-4  # Actually passed to Adam; non-trivial decay against memorization. NOTE: must keep the decimal point so yaml.safe_load parses it as float, not str
epochs: 20
lr: 0.0001

num_frames: 200  # More volumes resist memorization; val scales with it below
train_fraction: 0.8  # If > 1, interpreted as number of volumes not a fraction
val_fraction: 0.15    # 0.15 of 200 = 30 val volumes; 10 was too noisy an objective
# Remainder is test set

# Hyperparameters for the new (transposed) BarlowTrack loss
lambd_obj: 0.67  # Set to 1 to only use the transposed loss; 0 means only original BarlowTwins loss
# Optional separate off-diagonal weight for the object-space loss (default: falls back to lambd).
# Suggested sweep 0.05-0.3 once the projector is LayerNorm; the 0.0051 default under-penalizes object collapse.
lambd_obj_offdiag: null

####
# Data views: the position/global path (active when use_position is true)
#
# Per view, in order: (1) ONE global affine warps the whole volume AND the
# keypoint coordinates together; (2) crops are cut at the transformed
# centroids, keeping an independent object subset (dropout); (3) photometric
# noise/blur is applied per crop. The two views thus differ by global geometry
# + jitter + subset + photometrics -- but note there is NO independent
# per-crop warping here, so per-object geometric diversity is weaker than in
# the legacy path below. Dropout/jitter are the main anti-memorization levers.
####

# Global-before-crop augmentation: ONE affine per view, shared by everything
# in it (whole volume + keypoints in the position path; whole crop stack in
# the image-only path). Active in BOTH paths whenever these settings exist.
global_augment:
  p_global_affine: 1.0
  max_degrees_z: 180.0
  scale_jitter: 0.1
  max_translation: [2, 8, 8]
  p_flip: 0.25

# Position-only augmentations (only used when use_position is true).
# Jitter shifts each view's crop centers + keypoints with Gaussian noise
# (voxels; float or [z, x, y]); dropout drops an independent object subset
# per view and the loss is computed on the surviving intersection.
position_augment:
  jitter_std: 1.0
  dropout_p: 0.4  # Raised from 0.2: views must differ more on small data
  min_keep: 2

# Explicit per-volume coordinate canonicalization at the KENC input:
# subtract the volume centroid, divide by mean radius (removes translation
# + overall scale, statelessly, identically in train and eval). This is NOT
# full affine invariance (rotation/shear remain); it stops asking the
# pointwise position MLP to learn translation invariance from augmentation.
canonicalize_keypoints: false

# Per-crop photometric augmentation, applied AFTER cropping (both paths)
crop_photometric:
  p_blur: 0.0
  p_noise: 0.1
  std_noise: 0.25

####
# Position encodings + SuperGlue-GNN model options
# (use_position/use_attention false = legacy image-only behavior)
####
use_position: true  # If true: global-before-crop aug + KeypointEncoder fusion
use_attention: true # If true (requires use_position): intra-volume self-attention embeddings
fusion: concat       # 'concat' (default) | 'add' (SuperGlue-style) | 'position_only' (geometry benchmark)
fusion_norm: layernorm # per-branch norm before fusion: 'layernorm' (recommended) | 'l2' | 'none' (legacy)
self_layers: 2       # number of intra-volume self-attention layers (attention models)
attn_gate_init: -4.0 # initial attention gate logit; sigmoid(-4)~0.018 starts attention "almost off"
center_per_volume: true # subtract the per-volume mean before self-attention (kills the shared frame-identity attractor)
keypoint_encoder_layers: [32, 64]

####
# LEGACY augmentation: image-only path (only used when use_position is false)
#
# These warp EACH CROP independently (affine + elastic + flip per object).
# Note the global_augment settings above ALSO apply to the image-only path
# (one consistent warp per view); the settings here add per-crop diversity
# on top. DEAD when use_position is true -- kept so the same file serves both paths.
####
p_RandomAffine_both: # If set, overrides the two below

# First path through the Siamese network
p_RandomAffine_base: 1.0
p_RandomBlur_base: 0.1

# Second path; default is more augmentation
p_RandomAffine_flip: 1.0  # A 180 degree rotation, like a flip
p_RandomBlur: 0.0
p_RandomAffine: 1.0  # At least one deformation should have probability 1, so that the two images are definitely different
p_RandomElasticDeformation: 1.0
zxy_RandomElasticDeformation: [1, 3, 3]
p_RandomNoise: 0.1
std_RandomNoise: 0.25

# Debugging and logging parameters
print_freq: 100
rank: 0
dryrun: false
DEBUG: false
