# posonly_fast base for Samuel 153: base_zimmer.yaml with this project (98 GT neurons as
# finished neurons; the proxy and the eval read them through allow_hybrid_loading).
project_path: /lisc/data/scratch/neurobiology/zimmer/fieseler/barlow_track_paper/samuel_data/projects/153/project_config.yaml
pretrained_model_path:
wandb_name:
wandb_username: charlesfieseler
projector: 2048-2048
projector_final: 512
embedding_dim: 512
projector_norm: layernorm
backbone_kwargs:
  num_levels: 2
  f_maps: 4
target_sz_z: 8
target_sz_xy: 64
lambd: 0.0051
batch_size: 1
weight_decay: 1.0e-6
epochs: 15
lr: 1.0e-4
num_frames: 100
train_fraction: 0.8
val_fraction: 0.1
lambd_obj: 0.67
print_freq: 100
rank: 0
dryrun: false
DEBUG: false
training_fraction: 0.8
seed: 43
project_dir:
# num_workers > 0 crashes on zip-stored zarr (forked workers share the ZipStore handle)
num_workers: 0
# Per-epoch frame-pair matching proxy on 30 never-sampled frames (position features here)
val_match_frames: 30
# No volumes or crops: position-only reads only keypoints (fast local iteration)
keypoints_only: true

use_position: true
use_attention: false
position_encoder: visnet
fusion: position_only
fusion_norm: layernorm
center_per_volume: true
self_layers: 0
keypoint_encoder_layers:
- 32
- 64
visnet_cutoff: 0.35
visnet_neighbors: 32
visnet_rbf_rescale: true
visnet_cutoff_nn: 0
crop_photometric:
  p_blur: 0.0
  p_noise: 0.1
  std_noise: 0.25
position_augment:
  dropout_p: 0.2
  jitter_std: 1.0
  min_keep: 2
global_augment:
  p_global_affine: 1.0
  max_degrees_z: 180.0
  scale_jitter: 0.1
  max_translation:
  - 2
  - 8
  - 8
  p_flip: 0.25
  apply_to_volume: false
  elastic_std: [0.2, 2.9, 2.9]
  elastic_scale: 0.0
  # Used only when elastic_scale > 0: elastic_std and elastic_length are the best match to real lag-100 motion on zimmer
  # ([[EVD - The position augmentation deforms mid-range neighbour distances less than real motion does]])
  elastic_length: 19.0
