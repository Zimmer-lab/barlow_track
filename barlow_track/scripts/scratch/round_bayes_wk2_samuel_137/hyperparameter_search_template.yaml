# round_bayes_wk2 on samuel_137: generated by make_per_recording_rounds.py from grid.yaml
objective_cpu_job: true
objective_minutes: 1440
train_hours: 48
train_gpu_job_cpus: 16
max_consecutive_failures: 10
hyperparameters:
- name: fusion
  type: choice
  values:
  - visual_only
  - add
- name: self_layers
  type: choice
  values:
  - 0
  - 1
  - 2
  value_type: int
  is_ordered: true
- name: lambd_obj
  type: range
  bounds:
  - 0.0
  - 1.0
- name: lr
  type: range
  bounds:
  - 1.0e-05
  - 0.0003
  log_scale: true
- name: epochs
  type: range
  bounds:
  - 2
  - 30
  value_type: int
  log_scale: true
- name: num_frames
  type: range
  bounds:
  - 30
  - 500
  value_type: int
  log_scale: true
- name: global_augment.max_degrees_z
  type: range
  bounds:
  - 0.0
  - 180.0
- name: global_augment.scale_jitter
  type: range
  bounds:
  - 0.0
  - 0.25
- name: global_augment.elastic_scale
  type: range
  bounds:
  - 0.0
  - 1.5
- name: crop_photometric.crop_degrees_z
  type: range
  bounds:
  - 0.0
  - 180.0
- name: crop_photometric.p_noise
  type: range
  bounds:
  - 0.0
  - 0.5
- name: position_augment.dropout_p
  type: range
  bounds:
  - 0.0
  - 0.3
- name: position_augment.spurious_p
  type: range
  bounds:
  - 0.0
  - 0.3
baseline_params_path: null
objective: accuracy
objective_dataset: samuel_137
objective_source: nwb
objective_gt: /lisc/data/scratch/neurobiology/zimmer/fieseler/barlow_track_paper/samuel_data/137.nwb
