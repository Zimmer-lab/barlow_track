# round_flavell_legacy_crop_aug baseline: the preprint flavell config (as in
# round_flavell_paper_ablation) through the position pipeline with the preprint's
# per-crop view transforms (crop_augment: legacy, from the p_* keys below), views
# re-drawn each epoch (reaugment_each_epoch), and the revision's global and position
# augmentation. The grid toggles fusion (visual_only | add) and whether that global
# augmentation transforms the volume or only the keypoints
# (global_augment.apply_to_volume). See README.md.
project_path: /lisc/data/scratch/neurobiology/zimmer/fieseler/barlow_track_paper/flavell_data/projects/2025_07_01/project_config.yaml
pretrained_model_path:
wandb_name: barlow_track_round_flavell_legacy_crop_aug
wandb_username: charlesfieseler
projector: 2048-2048
projector_final: 512
embedding_dim: 64
projector_norm: batchnorm
backbone_kwargs:
  num_levels: 2
  f_maps: 4
target_sz_z: 16
target_sz_xy: 64
p_RandomAffine_base: 1.0
p_RandomBlur_base: 0.1
p_RandomNoise_base: 0.0
p_RandomAffine_flip: 1.0
p_RandomBlur: 0.0
p_RandomAffine: 1.0
p_RandomElasticDeformation: 1.0
zxy_RandomElasticDeformation:
- 1
- 3
- 3
p_RandomNoise: 0.1
std_RandomNoise: 0.25
lambd: 0.0051
batch_size: 1
weight_decay: 1.0e-6
epochs: 50
lr: 1.0e-4
num_frames: 300
train_fraction: 0.8
val_fraction: 0.1
lambd_obj: 0.67
print_freq: 100
rank: 0
dryrun: false
DEBUG: false
training_fraction: 0.8
seed: 43
project_dir:
crop_augment: legacy
reaugment_each_epoch: true
# num_workers > 0 crashes on zip-stored zarr (forked workers share the ZipStore handle)
num_workers: 0
# Per-epoch frame-pair matching proxy on 30 never-sampled frames; no random draws
val_match_frames: 30

# Position branch, copied from round_flavell_more_epochs/train_config.yaml
# (whose trial_27 is the best flavell revision net, use_attention false).
use_position: true
use_attention: false
position_encoder: visnet
fusion: add
fusion_norm: layernorm
center_per_volume: true
self_layers: 0
keypoint_encoder_layers:
- 32
- 64
crop_photometric:
  p_blur: 0.0
  p_noise: 0.1
  std_noise: 0.25
position_augment:
  dropout_p: 0.2
  jitter_std: 1.0
  min_keep: 2
global_augment:
  p_global_affine: 1.0
  max_degrees_z: 180.0
  scale_jitter: 0.1
  max_translation:
  - 2
  - 8
  - 8
  p_flip: 0.25
  apply_to_volume: true
