# Hypothesis round: why do revision networks trail the preprint on flavell?
# The preprint checkpoint scores 0.952 (eval_accuracy project path, NWB GT);
# the best revision net (round_flavell_more_epochs trial_27) 0.924, 0.915 at the
# backbone stage, despite training longer (17,900 vs 11,900 steps).
# Direct grid (8 combos) from the PREPRINT config, toggling the design changes:
#   use_position   false = preprint legacy crop pipeline, no position
#                  true  = global augmentation + ViSNet position, add fusion
#                  (the training script ties the two together; separating them
#                  needs a visual-only fusion mode that does not exist yet)
#   embedding_dim  64 (preprint) vs 512 (revision)
#   projector_norm batchnorm (preprint) vs layernorm (revision)
# Corner (false, 64, batchnorm) = preprint design; (true, 512, layernorm) =
# round_flavell_more_epochs trial_27 at 50 instead of 75 epochs.
# Run with: python optimize_hyperparameters.py -p <this file> --direct_parameter_sweep --repetitions 2
# (slurm; NOT --DEBUG). --repetitions 2 gives each config a second training seed,
# since the effects looked for are ~1-3 pt.
# Objective: accuracy on the training project 2025_07_01, which scores against
# the PROJECT GT (preprint stored tracks: 0.927 there vs 0.968 vs the NWB GT).
# Fine for ranking; to compare with the preprint numbers, rescore the cached
# embeddings against the NWB GT afterwards (see README.md).
baseline_params_path: null

objective: accuracy
objective_dataset: flavell
objective_minutes: 240

hyperparameters:
  - name: use_position
    type: choice
    values: [false, true]
  - name: embedding_dim
    type: choice
    values: [64, 512]
    value_type: int
    is_ordered: true
  - name: projector_norm
    type: choice
    values: [batchnorm, layernorm]
