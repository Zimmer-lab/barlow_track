# round_posonly2_flavell: the fast loop's best position-only ViSNet (see train_config.yaml) with
# the three settings the local loop and round_posonly_zimmer left open. 2 x 2 x 2 grid, two
# seeds (--repetitions 2), 16 jobs:
#   position_augment.jitter_std  1.0 | auto  isotropic voxels, or per-axis centroid noise
#                                            estimated from the segmentation alone (no GT;
#                                            utils/dataset_stats.py, cb4e869)
#   visnet_cutoff_nn             0 | 6       fixed cutoff 0.35 in normalized units, or each
#                                            frame rescaled so the cutoff is 6 median NN
#                                            distances (scale-invariant, so global scale
#                                            jitter is a no-op; round_posonly_zimmer: 0.825 vs 0.868)
#   position_augment.dropout_p   0 | 0.02    (local full video: 0.932 vs 0.945, one seed)
# Run with: python optimize_hyperparameters.py -p <this file> --direct_parameter_sweep --repetitions 2
baseline_params_path: null

objective: accuracy
objective_dataset: flavell
# Score against the NWB GT, not the project's (the Flavell lab's tracker output, issue
# i261028-3), on the NWB's GT objects: the same condition as the benchmark's 'flavell' cell,
# so the post-sweep benchmark can skip it (objective_gt, this commit).
objective_source: nwb
objective_gt: /lisc/data/scratch/neurobiology/zimmer/fieseler/barlow_track_paper/flavell_data/images_for_charlie/flavell_data.nwb
objective_minutes: 240
# Keypoints only: no volumes, but width 512 and 600 frames; generous
train_hours: 48

hyperparameters:
  - name: position_augment.jitter_std
    type: choice
    values: [1.0, auto]
  - name: visnet_cutoff_nn
    type: choice
    values: [0, 6]
  - name: position_augment.dropout_p
    type: choice
    values: [0.0, 0.02]
