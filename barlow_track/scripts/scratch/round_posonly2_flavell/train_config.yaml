# round_posonly2_flavell baseline: position-only ViSNet (fusion position_only) on flavell with the
# settings the local fast loop found (barlow_track/scripts/scratch/posonly_fast, 2026-10-29):
# RBF fix on, absolute cutoff 0.35, no elastic deformation, no object dropout, ViSNet
# width 512, 600 frames, keypoints only (no volumes or crops loaded). Position jitter
# stays isotropic 1.0: no setting is fitted to a dataset's GT.
# The grid toggles synthetic segmentation errors (spurious points, merges, splits).
# See round_posonly2_zimmer/README.md.
project_path: /lisc/data/scratch/neurobiology/zimmer/fieseler/barlow_track_paper/flavell_data/projects/2025_07_01/project_config.yaml
pretrained_model_path:
wandb_name: barlow_track_round_posonly2_flavell
wandb_username: charlesfieseler
projector: 2048-2048
projector_final: 512
embedding_dim: 512
projector_norm: layernorm
backbone_kwargs:
  num_levels: 2
  f_maps: 4
target_sz_z: 16
target_sz_xy: 64
lambd: 0.0051
batch_size: 1
weight_decay: 1.0e-6
epochs: 60
lr: 1.0e-4
num_frames: 600
train_fraction: 0.8
val_fraction: 0.1
lambd_obj: 0.67
print_freq: 100
rank: 0
dryrun: false
DEBUG: false
training_fraction: 0.8
seed: 43
project_dir:
# num_workers > 0 crashes on zip-stored zarr (forked workers share the ZipStore handle)
num_workers: 0
# Per-epoch frame-pair matching proxy on 30 never-sampled frames (position features here)
val_match_frames: 30
# No volumes or crops: position-only reads only keypoints
keypoints_only: true

use_position: true
use_attention: false
position_encoder: visnet
fusion: position_only
fusion_norm: layernorm
center_per_volume: true
self_layers: 0
keypoint_encoder_layers:
- 32
- 64
visnet_cutoff: 0.35
visnet_neighbors: 32
visnet_hidden: 512
visnet_rbf_rescale: true
visnet_cutoff_nn: 0
crop_photometric:
  p_blur: 0.0
  p_noise: 0.1
  std_noise: 0.25
position_augment:
  dropout_p: 0.0
  # Isotropic, as every earlier run: no augmentation setting is fitted to this dataset's GT
  jitter_std: 1.0
  spurious_p: 0.0
  merge_p: 0.0
  split_p: 0.0
  min_keep: 2
global_augment:
  p_global_affine: 1.0
  max_degrees_z: 180.0
  scale_jitter: 0.1
  max_translation:
  - 2
  - 8
  - 8
  p_flip: 0.25
  apply_to_volume: false
  elastic_std: [1.1, 4.1, 4.1]
  elastic_scale: 0.0
  # Used only when elastic_scale > 0: elastic_std and elastic_length are the best match to real lag-100 motion on flavell
  # ([[EVD - The position augmentation deforms mid-range neighbour distances less than real motion does]])
  elastic_length: 41.0
