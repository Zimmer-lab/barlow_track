# Sensitivity tests around the frozen round_shared_v1 trial 59 recipe (base_train_config.yaml), one network per recording,
# scored by full-video tracking accuracy in the training GPU job (objective: accuracy, set per recording by
# make_per_recording_rounds.py).
# Global-affine replicates: p_global_affine 0 is the one single-seed variant whose effect splits by recording (Flavell
# 2022033002 collapses, Samuel gains 2-5 pt; v2 paired mean -3.7 +- 10.4 pt). These two add replicates 1 and 2 with the
# seeds the loss_volume control replicates used (replicate_seed(769243397, 1) and (.., 2)), so sensitivity_report.py pairs
# them with those controls by seed. The sweep samples `seed` itself, which overrides the replicate-seed policy.
objective_minutes: 1440
train_hours: 72

hyperparameters:
  - {name: global_augment.p_global_affine, type: choice, values: [0.0]}
  - {name: seed, type: choice, values: [763277047, 3712540559]}
