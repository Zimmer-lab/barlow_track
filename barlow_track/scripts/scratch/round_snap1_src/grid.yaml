# round_snap1: accuracy vs epochs (snapshots after 1 / 3 / 10 / 20 epochs, plus the final 30),
# image-only vs fused x lambd_obj 0 / 0.67: does the transpose loss reach its accuracy sooner
# (goal d: faster training counts)? Each CPU eval job scores the final checkpoint, then the four
# snapshots (objective_snapshots), so it runs ~5 full-video evals: hence objective_minutes 2880.
# train_gpu_job_cpus 16: 14 DataLoader workers (SLURM_CPUS_PER_TASK - 2).
objective_cpu_job: true
objective_snapshots: true
objective_minutes: 2880
train_hours: 48
train_gpu_job_cpus: 16
hyperparameters:
  - name: fusion
    type: choice
    values: [visual_only, add]
  - name: lambd_obj
    type: choice
    values: [0.0, 0.67]
